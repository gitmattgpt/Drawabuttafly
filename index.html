<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Butterfly Creator & AR Swarm</title>
  <link rel="stylesheet" href="src/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="viewport">
    <video id="camera-feed" autoplay playsinline muted></video>
    <div id="webgl-canvas"></div>
    <canvas id="gesture-canvas"></canvas>
  </div>

  <!-- Top Bar -->
  <div id="top-bar">
    <div class="control-card">
      <label class="swarm-toggle-label">
        <input type="checkbox" id="swarm-toggle" checked> Swarm Mode
      </label>
    </div>
  </div>

  <!-- Camera Button -->
  <button id="top-center-cam-btn" title="Capture Pattern">📷</button>

  <!-- Dynamic Bottom Toggle Button -->
  <button id="lib-toggle-btn">Show Library ▲</button>

  <!-- Collapsible Library Drawer -->
  <div id="library-drawer">
    <div id="drawer-header">
      <span style="font-weight:bold; color:#ff9800; font-size:0.85rem;">Swarm Count</span>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="range" id="swarm-slider" class="swarm-slider" min="1" max="20" value="10">
        <input type="number" id="max-slider-input" class="max-input-box" value="20" min="1" max="500">
      </div>
    </div>
    <div id="library-grid"></div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div id="status">Sensors Initializing...</div>
    <button id="start-btn" class="btn">Start AR Session 🎥</button>
  </div>

  <!-- Refinement Editor Modal -->
  <div id="editor-modal">
    <div style="font-weight:bold; color:#ff9800; margin-top:10px;">Refine Captured Butterfly</div>
    <canvas id="editor-canvas" width="512" height="512"></canvas>
    
    <div class="editor-card">
      <div class="editor-row">
        <label>Centerline Alignment <span id="center-val">50%</span></label>
        <input type="range" id="center-slider" min="0" max="100" value="50">
      </div>
      <div class="editor-row">
        <label>Transparency Threshold <span id="trans-val">15%</span></label>
        <input type="range" id="trans-slider" min="0" max="100" value="15">
      </div>
    </div>

    <div class="editor-btn-group">
      <button id="editor-cancel" class="editor-btn" style="background:#444; color:#fff;">Discard</button>
      <button id="editor-save" class="editor-btn" style="background:#ff9800; color:#000;">Add to Swarm 🦋</button>
    </div>
  </div>

  <!-- Confirmation Modal -->
  <div id="confirm-modal">
    <div class="modal-card">
      <p id="modal-msg" style="font-size:0.9rem;">Are you sure you want to delete this butterfly?</p>
      <div class="modal-btns">
        <button id="modal-confirm" class="modal-btn modal-btn-confirm">Delete</button>
        <button id="modal-cancel" class="modal-btn modal-btn-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="src/main.js"></script>
</body>
</html>
