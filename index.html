<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Butterfly Tracker Studio</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <!-- MindAR Image Tracker for Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-three.prod.js"></script>
</head>
<body>
  <div id="app">
    <header id="app-header">
      <h1>AR Butterfly Target Studio</h1>
    </header>

    <!-- Step 1: Upload or Capture -->
    <section id="capture-step" class="step active">
      <p>Take a clear photo of your butterfly drawing on paper to set it as the AR tracking target:</p>
      <input type="file" id="camera-input" accept="image/*" capture="environment">
      <label for="camera-input" class="btn">📷 Take Photo of Paper</label>
    </section>

    <!-- Step 2: Compiler & Threshold Adjustments -->
    <section id="adjust-step" class="step">
      <h2>Extract Butterfly & Prepare Target</h2>
      <div class="canvas-container">
        <canvas id="threshold-canvas"></canvas>
      </div>
      
      <div class="controls">
        <label for="threshold-slider">Exposure / Alpha Threshold:</label>
        <input type="range" id="threshold-slider" min="0" max="255" value="180">
        
        <label for="split-slider">Centerline Axis:</label>
        <input type="range" id="split-slider" min="10" max="90" value="50">
        
        <button id="generate-3d-btn" class="btn">Compile Target & Start AR 🚀</button>
      </div>

      <div id="compiler-status" class="status-msg"></div>
    </section>

    <!-- Step 3: MindAR Image Tracker Viewport -->
    <section id="preview-step" class="step">
      <div id="ar-container"></div>
      <div class="ar-controls">
        <button id="re-adjust-btn" class="btn secondary">Back to Editing</button>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
