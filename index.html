<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Camera 3D Mesh Generator</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <h1>Live WebAR 3D Scanner</h1>
    </header>

    <!-- Scan & Mesh Controls -->
    <div id="viewport-container">
      <video id="camera-feed" autoplay playsinline muted></video>
      <div id="webgl-container"></div>
    </div>

    <div class="hud-controls">
      <button id="scan-btn" class="btn">Start Scanning 🎥</button>
      <button id="reset-btn" class="btn secondary">Reset Mesh 🔄</button>
    </div>
    
    <div id="status" class="status-msg">Move phone slowly around the room to generate mesh...</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
