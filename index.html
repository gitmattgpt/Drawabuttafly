
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Draw A Butterfly - AR Marker View</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Container for WebGL/AR Viewport */
    #ar-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* UI Overlay Controls */
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
    }

    /* Top Action Buttons */
    .top-controls {
      pointer-events: auto;
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 170, 0, 0.9);
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    /* Target Reticle in Center */
    .center-target {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 260px;
      height: 260px;
      border: 2px dashed rgba(255, 170, 0, 0.8);
      border-radius: 50%;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .center-target::before {
      content: '';
      position: absolute;
      width: 2px;
      height: 100%;
      background-color: #ff2a55;
    }

    /* Bottom Control Bar */
    .bottom-controls {
      pointer-events: auto;
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .library-btn {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .slider-card {
      width: 100%;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffaa00;
      font-size: 14px;
      font-weight: bold;
    }

    .slider-card input[type="range"] {
      width: 50%;
      accent-color: #ffffff;
    }

    .slider-card .count-badge {
      background: #000;
      border: 1px solid #ffaa00;
      padding: 4px 8px;
      border-radius: 6px;
      color: #fff;
    }
  </style>

  <!-- Import Three.js and MindAR libraries -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
</head>
<body>

  <!-- AR Camera View Container -->
  <div id="ar-container"></div>

  <!-- UI Elements Overlay -->
  <div id="ui-overlay">
    <!-- Top Action Toolbar -->
    <div class="top-controls">
      <button class="icon-btn" id="btn-flash" title="Toggle Flashlight">🔦</button>
      <button class="icon-btn" id="btn-capture" title="Capture Pattern">📷</button>
      <button class="icon-btn" id="btn-retrack" title="Refocus Target">📸</button>
    </div>

    <!-- Alignment Guideline Overlay -->
    <div class="center-target"></div>

    <!-- Bottom Controls -->
    <div class="bottom-controls">
      <button class="library-btn">Show Library ▲</button>
      
      <div class="slider-card">
        <span>Swarm Count</span>
        <input type="range" id="swarm-slider" min="1" max="50" value="20" />
        <span class="count-badge" id="swarm-count-text">20</span>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';

    let mindarThree = null;
    let pinnedButterflyMesh = null;
    let wingAngle = 0;

    // Initialize AR system and Image Tracker
    const initAR = async () => {
      // Setup AR Controller attached to view container
      mindarThree = new MindARThree({
        container: document.querySelector("#ar-container"),
        // Load default camera target marker or dynamically registered marker
        imageTargetSrc: "https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind",
        maxTrack: 1
      });

      const { renderer, scene, camera } = mindarThree;

      // -------------------------------------------------------------
      // PINNED ANCHOR LOGIC:
      // The butterfly attaches ONLY to the specific image target marker.
      // It stays anchored at (0, 0, 0) relative to the piece of paper.
      // -------------------------------------------------------------
      const anchor = mindarThree.addAnchor(0);

      // Create procedural Butterfly 3D Object
      pinnedButterflyMesh = create3DButterfly();
      
      // Position directly on top center of physical paper target
      pinnedButterflyMesh.position.set(0, 0, 0);
      
      // Attach butterfly directly to the marker's local group space
      anchor.group.add(pinnedButterflyMesh);

      // Target visibility listeners
      anchor.onTargetFound = () => {
        pinnedButterflyMesh.visible = true;
      };
      
      anchor.onTargetLost = () => {
        pinnedButterflyMesh.visible = false;
      };

      // Start AR camera feed
      await mindarThree.start();

      // Render Loop
      renderer.setAnimationLoop(() => {
        // Continuous wing flapping and circular walking animation on top of the paper
        if (pinnedButterflyMesh && pinnedButterflyMesh.visible) {
          animateButterfly(pinnedButterflyMesh);
        }
        renderer.render(scene, camera);
      });
    };

    // Helper: Construct animated 3D Butterfly Mesh
    function create3DButterfly() {
      const butterflyGroup = new THREE.Group();

      // Wing Material (Transparent Canvas Texture Target)
      const wingGeometry = new THREE.PlaneGeometry(0.5, 0.5);
      const wingMaterial = new THREE.MeshBasicMaterial({
        color: 0xffaa00,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.9
      });

      // Left Wing
      const leftWing = new THREE.Mesh(wingGeometry, wingMaterial);
      leftWing.name = "leftWing";
      leftWing.geometry.translate(-0.25, 0, 0); // Origin at wing pivot
      butterflyGroup.add(leftWing);

      // Right Wing
      const rightWing = new THREE.Mesh(wingGeometry, wingMaterial);
      rightWing.name = "rightWing";
      rightWing.geometry.translate(0.25, 0, 0); // Origin at wing pivot
      butterflyGroup.add(rightWing);

      // Body
      const bodyGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.4);
      const bodyMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.rotation.x = Math.PI / 2;
      butterflyGroup.add(body);

      // Scale relative to tracking target size
      butterflyGroup.scale.set(1.2, 1.2, 1.2);

      return butterflyGroup;
    }

    // Butterfly local walking and flapping animation
    function animateButterfly(butterfly) {
      wingAngle += 0.15;
      const flap = Math.sin(wingAngle) * 0.6;

      const leftWing = butterfly.getObjectByName("leftWing");
      const rightWing = butterfly.getObjectByName("rightWing");

      if (leftWing && rightWing) {
        leftWing.rotation.y = flap;
        rightWing.rotation.y = -flap;
      }

      // Slow circular path across the paper target surface
      const radius = 0.1;
      butterfly.position.x = Math.cos(wingAngle * 0.2) * radius;
      butterfly.position.z = Math.sin(wingAngle * 0.2) * radius;
      butterfly.rotation.y = -(wingAngle * 0.2) + Math.PI / 2;
    }

    // UI Controls Setup
    const slider = document.getElementById("swarm-slider");
    const countText = document.getElementById("swarm-count-text");

    slider.addEventListener("input", (e) => {
      countText.innerText = e.target.value;
    });

    // Run AR App
    window.addEventListener("DOMContentLoaded", () => {
      initAR();
    });
  </script>
</body>
</html>
